name: CI

on:
  push:
  pull_request:

jobs:
  commit-lint:
    name: Commit message
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit message format
        run: |
          MSG=$(git log -1 --pretty=%s)
          echo "Commit: $MSG"
          if ! echo "$MSG" | grep -qP '^:[a-z0-9_]+: \[(back|front|infra|ci|doc)\] [A-Z]'; then
            echo "Invalid commit message format."
            echo "Expected: :[emoji]: [(back|front|infra|ci|doc)] Capitalized message"
            echo "Example:  :sparkles: [front] Add player speed controls"
            exit 1
          fi

  biome:
    name: Code quality
    needs: commit-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check code
        run: npm run check

  tests:
    name: Tests
    needs: biome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build
